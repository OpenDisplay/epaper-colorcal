[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epaper-colorcal"
version = "0.1.0"
description = "Drive a CHNSpec CR30 spectral colorimeter to produce measured e-paper color palettes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "g4bri3lDev", email = "admin@g4bri3l.de"}
]

keywords = ["e-paper", "e-ink", "colorimeter", "cr30", "color-calibration", "spectral", "dithering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "colour-science>=0.4.4",
    "epaper-dithering>=7,<8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Talking to the physical CR30 over serial. Not needed for --dry-run / tests.
serial = [
    "pyserial-asyncio>=0.6",
]
# Interactive mode: drive an OpenDisplay panel over BLE so the display cycles colors
# while the CR30 stays put. Not needed for --dry-run / tests.
opendisplay = [
    "py-opendisplay>=8.0.0; python_version >= '3.13'",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
]
dev = [
    "mypy>=1.19.1",
    "prek>=0.3.4",
    "pylint>=4.0.5",
    "ruff>=0.14.10",
]

[project.scripts]
epaper-colorcal = "epaper_colorcal.measure_palette:main"

[project.urls]
Homepage = "https://opendisplay.org"
Repository = "https://github.com/OpenDisplay/epaper-colorcal"
Documentation = "https://github.com/OpenDisplay/epaper-colorcal#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/epaper_colorcal"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored upstream code (itohio/color-science, MIT) is kept verbatim — don't lint it.
# force-exclude makes ruff honor this even for files passed explicitly (e.g. by pre-commit).
extend-exclude = ["src/epaper_colorcal/_vendor"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
# Analysis target only (runtime still supports 3.11). 3.12+ is needed so mypy can parse
# numpy 2.5's stubs, which use the PEP 695 `type` statement. Our code uses no 3.12-only syntax.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# Vendored upstream code is untyped; exclude it and the third-party libs without stubs.
exclude = ["src/epaper_colorcal/_vendor/"]

[[tool.mypy.overrides]]
# colour-science has no stubs; opendisplay/epaper_dithering/PIL are only present with the
# optional `opendisplay` extra (interactive mode), so don't require them for type-checking.
module = ["colour.*", "opendisplay.*", "epaper_dithering.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored protocol slice is untyped; treat its symbols as Any rather than checking it.
module = ["epaper_colorcal._vendor.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pylint.main]
# Vendored upstream code is kept verbatim — don't lint it.
ignore-paths = ["src/epaper_colorcal/_vendor/.*"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Pragmatic disables for a small CLI tool. Ruff already covers import/style hygiene.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "import-outside-toplevel",
    "duplicate-code",
    # warnings filter must run before `import colour` (also marked noqa: E402 for ruff)
    "wrong-import-position",
    # SpdSource/SpdProvider callbacks must accept `name` even when a given source ignores it
    "unused-argument",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*related API features are not available.*",
    "ignore:.*Aligning .* shape.*",
]
